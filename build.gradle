plugins {
    id "java"
    id "net.neoforged.moddev" version "2.0.147"
}

version = "${mod_version}+mc${minecraft_version}"
group = "petch.litematica_autorotate"
base.archivesName = "litematica-autorotate-neoforge"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

neoForge {
    version = project.neoforge_version

    // Forgematica (NeoForge port of Litematica) and MaFgLib (port of MaLiLib) are
    // published in Mojang mappings, the same as NeoForge itself, so they can be used directly.
    mods {
        litematica_autorotate {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            client()
        }
    }
}

dependencies {
    implementation "maven.modrinth:forgematica:${forgematica_version}"
    implementation "maven.modrinth:mafglib:${mafglib_version}"
    // MaFgLib and Forgematica on 26.x load their access wideners through this; only needed to run.
    runtimeOnly "maven.modrinth:foxifiedclasstweaker:${classtweaker_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}
