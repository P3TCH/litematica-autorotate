side = "CLIENT"

[[dependencies.litematica_autorotate]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.litematica_autorotate]]
modId = "forgematica"
type = "required"
versionRange = "[0.4,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.litematica_autorotate]]
