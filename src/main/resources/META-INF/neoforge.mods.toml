loaderVersion = "[4,)"
license = "CC0-1.0"
issueTrackerURL = "https://github.com/P3TCH/litematica-autorotate/issues"

[[mods]]
modId = "litematica_autorotate"
version = "${version}"
displayName = "Litematica Auto Rotate"
displayURL = "https://github.com/P3TCH/litematica-autorotate"
authors = "petch"
description = '''
Add-on for Litematica (Forgematica): rotates the player toward the schematic block's facing right before placing, so blocks face the right way on servers without Carpet.
'''

[[mixins]]
config = "litematica_autorotate.mixins.json"

